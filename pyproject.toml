[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curva-di-copom"
version = "1.0.0"
description = "Curva de juros DI, Selic implícita por reunião do Copom e análise de movimentos da curva brasileira"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Carlos Eduardo Ferraz" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "requests>=2.31",
    "plotly>=5.24",
]

[project.optional-dependencies]
app = ["streamlit>=1.50", "kaleido>=1.0"]
dev = ["pytest>=8.0", "jupyterlab>=4.0", "ipykernel>=6.0", "nbformat>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
